apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpulse-demo-java-shop
  labels:
    app: devpulse-demo-java-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devpulse-demo-java-shop
  template:
    metadata:
      labels:
        app: devpulse-demo-java-shop
    spec:
      containers:
        - name: shop-app
          image: your-registry/devpulse-demo-java-shop:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
